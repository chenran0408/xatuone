name: CI Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: 检查 Android 源码和随包的 XATU 适配资源
        run: bash gradlew :shared:compileAndroidMain :shared:testAndroidHostTest :androidApp:lintRelease --no-daemon

  build-android:
    needs: check-android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Release-Signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: 构建已签名的正式版
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/xatuone-release.jks"
          trap 'rm -f "$store"' EXIT
          printf '%s' "${KEYSTORE_BASE64:?}" | base64 --decode > "$store"
          bash gradlew :androidApp:assembleRelease --no-daemon --no-configuration-cache \
            "-Pandroid.injected.signing.store.file=$store" \
            "-Pandroid.injected.signing.store.password=${KEYSTORE_PASSWORD:?}" \
            "-Pandroid.injected.signing.key.alias=${KEY_ALIAS:?}" \
            "-Pandroid.injected.signing.key.password=${KEY_PASSWORD:?}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
