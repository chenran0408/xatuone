name: iPhone preview
on:
  push:
    branches: [ios/campus-preview]
    paths: ['iosApp/**', 'shared/assets/offline_repo/schools/resources/XATU/myschool.js', '.github/workflows/ios-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare XcodeGen
        run: |
          curl --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/tool"
          binary="$(find "$RUNNER_TEMP/tool" -type f -name xcodegen | head -1)"
          test -x "$binary"
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          xcodebuild -version
      - name: Build iPhone device IPA
        run: bash iosApp/build-ipa.sh "$RUNNER_TEMP/xatu-ios"
      - name: Save device debug symbols separately
        uses: actions/upload-artifact@v4
        with:
          name: XATU-One-iPhone-dSYMs
          path: ${{ runner.temp }}/xatu-ios/device/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: error
      - name: Run tests on iPhone Simulator
        id: tests
        working-directory: iosApp
        run: |
          read -r model runtime <<<"$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["deviceTypeIdentifier"] + " " + r for r, rows in sorted(devices.items(), reverse=True)
                     if ".iOS-" in r for d in rows if d["name"].startswith("iPhone")))')"
          device="$(xcrun simctl create XatuOne-EventKit-CI "$model" "$runtime")"
          trap 'xcrun simctl delete "$device"' EXIT
          xcrun simctl bootstatus "$device" -b
          build="$RUNNER_TEMP/ios-tests"
          result="$RUNNER_TEMP/XatuOneTests.xcresult"
          args=(-quiet -project XatuOne.xcodeproj -scheme XatuOne -configuration Debug
                -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -derivedDataPath "$build")
          xcodebuild build-for-testing "${args[@]}"
          xcrun simctl install "$device" "$build/Build/Products/Debug-iphonesimulator/XatuOne.app"
          xcrun simctl privacy "$device" grant calendar com.xatuone.campus
          TEST_RUNNER_XATU_EVENTKIT_CI_DEVICE="$device" xcodebuild test-without-building "${args[@]}" -resultBundlePath "$result"
          xcrun xcresulttool get test-results tests --path "$result" > "$RUNNER_TEMP/xatu-test-tree.json"
          python3 - "$RUNNER_TEMP/xatu-test-tree.json" <<'PY'
          import json, sys
          def visit(node):
              yield node
              for child in node.get("children", []):
                  yield from visit(child)
          with open(sys.argv[1]) as file:
              roots = json.load(file)["testNodes"]
          target = "testRepeatedSyncMoveAndDeletePreserveUnmanagedEvents"
          matches = [node for root in roots for node in visit(root) if node.get("nodeType") == "Test Case"
                     and node.get("nodeIdentifier", "").rsplit("/", 1)[-1].removesuffix("()") == target]
          if not any(node.get("result") == "Passed" for node in matches):
              sys.exit("The EventKit integration test did not pass on the dedicated simulator.")
          print("EventKit calendar integration passed on the dedicated iPhone simulator.")
          PY
      - name: Test results
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          if test -d "$RUNNER_TEMP/XatuOneTests.xcresult"; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/XatuOneTests.xcresult"
          fi
      - name: Save simulator diagnostics on failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-simulator-diagnostics
          path: ${{ runner.temp }}/XatuOneTests.xcresult
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: XATU-One-iPhone-unsigned
          path: |
            ${{ runner.temp }}/xatu-ios/*.ipa
            ${{ runner.temp }}/xatu-ios/SHA256SUMS
          if-no-files-found: error
