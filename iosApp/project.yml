name: XatuOne
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  XatuOne:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - path: ../shared/assets/offline_repo/schools/resources/XATU/myschool.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xatuone.campus
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  XatuOneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: XatuOne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xatuone.campus.tests
        GENERATE_INFOPLIST_FILE: YES
  XatuOneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: XatuOne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xatuone.campus.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  XatuOne:
    build:
      targets:
        XatuOne: all
    test:
      targets: [XatuOneTests, XatuOneUITests]
