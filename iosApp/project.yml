name: XatuOne
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.0
targets:
  XatuOne:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - path: ../shared/assets/offline_repo/schools/resources/XATU/myschool.js
        buildPhase: resources
    dependencies:
      - target: CourseWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xatuone.campus
        CODE_SIGN_ENTITLEMENTS: Widget/CourseSharing.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CourseWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget/CourseWidget.swift
      - Sources/Device/CourseWidgetData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xatuone.campus.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/CourseSharing.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  XatuOneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: XatuOne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xatuone.campus.tests
        GENERATE_INFOPLIST_FILE: YES
  XatuOneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: XatuOne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xatuone.campus.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  XatuOne:
    build:
      targets:
        XatuOne: all
    test:
      targets: [XatuOneTests, XatuOneUITests]
